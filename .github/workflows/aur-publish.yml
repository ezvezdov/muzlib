name: Publish to AUR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without v prefix, e.g. 0.3.2)'
        required: true

  # Run after the PyPI upload, since the PKGBUILD checksum comes from the PyPI sdist
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_run, check out the commit that was published to PyPI
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Get release version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
            if [ -z "$VERSION" ]; then
              echo "Could not read version from pyproject.toml" >&2
              exit 1
            fi
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Update PKGBUILD version and checksum
        run: |
          # Update pkgver
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.VERSION }}/" ./deploy/linux/PKGBUILD
          # Reset pkgrel
          sed -i "s/^pkgrel=.*/pkgrel=1/" ./deploy/linux/PKGBUILD
          # Fetch new sha256sum (fail instead of hashing an error page if the sdist is missing)
          URL="https://files.pythonhosted.org/packages/source/m/muzlib/muzlib-${{ steps.version.outputs.VERSION }}.tar.gz"
          curl -fsSL --retry 5 --retry-delay 30 --retry-all-errors -o sdist.tar.gz "$URL"
          SHA=$(sha256sum sdist.tar.gz | cut -d' ' -f1)
          rm sdist.tar.gz
          sed -i "s/^sha256sums=.*/sha256sums=('$SHA')/" ./deploy/linux/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: python-muzlib
          pkgbuild: ./deploy/linux/PKGBUILD
          commit_username: ${{ github.repository_owner }}
          commit_email: ezvezdov22@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.version.outputs.VERSION }}"
